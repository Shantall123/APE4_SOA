#user  nobody;
worker_processes  1;

events {
    worker_connections 1024;
}

http {


    log_format clase
        '$time_local $remote_addr "$request" status=$status '
        'backend=$upstream_addr upstream_status=$upstream_status '
        'rt=$request_time urt=$upstream_response_time';

    access_log logs/access.log clase;
    error_log  logs/error.log  warn;

    # Balanceo ponderado 3:1 entre las dos instancias Java
    upstream vehiculos_backend {
        server 127.0.0.1:8080 weight=3 max_fails=1 fail_timeout=10s;   # Instancia A
        server 127.0.0.1:8083 weight=1 max_fails=1 fail_timeout=10s;   # Instancia B
    }

    # Servicio de compradores y ventas (FastAPI), sin balanceo
    upstream ventas_backend {
        server 127.0.0.1:8000;
    }

    # Servicio de notificaciones (Spring Boot), sin balanceo
    upstream notificaciones_backend {
        server 127.0.0.1:8082;
    }

    server {
        listen 127.0.0.1:8090;
        server_name localhost;

        # Encabezados comunes. IMPORTANTE: NGINX solo los hereda en los
        # location que NO declaran su propio proxy_set_header; por eso
        # ningun location los redefine. Las cabeceras propias del cliente
        # (X-Service-Key, Idempotency-Key, X-Notification-Key) se reenvian
        # automaticamente sin declararlas.
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;

        # ---------------- Salud de NGINX (no toca backends) ----------------
        location = /nginx-ping {
            access_log off;
            default_type text/plain;
            return 200 "pong\n";
        }

        # ---------------- API Java de vehiculos (balanceada 3:1) ----------
        location = /oauth/token {
            proxy_pass http://vehiculos_backend;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location /api/vehiculos {
            proxy_pass http://vehiculos_backend;
            # Solo GET/HEAD se reintentan en la otra instancia;
            # POST/PUT/PATCH/DELETE no se repiten (non_idempotent desactivado).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location = /api/identidad {
            proxy_pass http://vehiculos_backend;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Rutas internas de reservas usadas por FastAPI (X-Service-Key)
        location /api/reservas {
            proxy_pass http://vehiculos_backend;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }

        # Salud de Spring Boot (requiere agregar Actuator al proyecto;
        # mientras no exista, la API responde 401)
        location = /actuator/health {
            proxy_pass http://vehiculos_backend;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # ---------------- FastAPI: compradores y ventas ------------------
        location /api/compradores {
            proxy_pass http://ventas_backend;
        }

        location /api/ventas {
            proxy_pass http://ventas_backend;
            # Nunca reintentar una venta en otro backend
            proxy_next_upstream off;
        }

        location = /ventas/health {
            proxy_pass http://ventas_backend/health;
        }

        # ---------------- Notificaciones (consulta para JavaFX) ----------
        location /api/notificaciones {
            proxy_pass http://notificaciones_backend;

            # Soporte opcional para /api/notificaciones/stream (SSE)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # Cualquier otra ruta no se expone
        location / {
            default_type application/json;
            return 404 '{"status":404,"title":"Ruta no expuesta por NGINX"}';
        }
    }
}
